# @title Local Docker stack
# @notice Every MCP server in the sibling repos, plus the gateway, on one network.
# @dev Backends have no `ports` key. The host cannot open them. The gateway is
#      the only published process, on 127.0.0.1:8090. Inside the container the
#      gateway still listens on 8080. Host port 8080 is already used by another
#      project.
#
#      Each *_MCP_URL overrides the cluster DNS name in config/gateway.yaml.
#      API keys are not written in this file. Compose reads them from
#      .env.backends, which is gitignored. Medical MCP still receives none:
#      its paid tools stay off the allowlist, and a key mounted by habit
#      would let a later allowlist edit spend it.

x-backend-health: &backend-health
  # @notice /readyz means the process has finished MCP initialize.
  #         It does not call upstream APIs.
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 15s

services:
  medical-mcp:
    image: medical-mcp:local
    build:
      context: ../medical-mcp
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  bitcoin-mcp:
    image: bitcoin-mcp:local
    build:
      context: ../bitcoin-mcp
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  cross-llm-mcp:
    image: cross-llm-mcp:local
    build:
      context: ../cross-llm-mcp
    env_file:
      - path: .env.backends
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  eu-legal-mcp:
    image: eu-legal-mcp:local
    build:
      context: ../eu-legal-mcp
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  evm-mcp:
    image: evm-mcp:local
    build:
      context: ../evm-mcp
    env_file:
      - path: .env.backends
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  prediction-markets-mcp:
    image: prediction-markets-mcp:local
    build:
      context: ../prediction-markets-mcp
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  system-prompts:
    image: system-prompts-mcp:local
    build:
      context: ../system-prompts-and-models-of-ai-tools
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  transcript-mcp:
    image: transcript-mcp:local
    build:
      context: ../transcript-mcp
    env_file:
      - path: .env.backends
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  us-legal-mcp:
    image: us-legal-mcp:local
    build:
      context: ../us-legal-mcp
    env_file:
      - path: .env.backends
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck: *backend-health

  gateway:
    image: omni-gateway:local
    build: .
    depends_on:
      medical-mcp:
        condition: service_healthy
      bitcoin-mcp:
        condition: service_healthy
      cross-llm-mcp:
        condition: service_healthy
      eu-legal-mcp:
        condition: service_healthy
      evm-mcp:
        condition: service_healthy
      prediction-markets-mcp:
        condition: service_healthy
      system-prompts:
        condition: service_healthy
      transcript-mcp:
        condition: service_healthy
      us-legal-mcp:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      GATEWAY_CONFIG: /app/config/gateway.yaml
      MEDICAL_MCP_URL: http://medical-mcp:3000/mcp
      BITCOIN_MCP_URL: http://bitcoin-mcp:3000/mcp
      CROSS_LLM_MCP_URL: http://cross-llm-mcp:3000/mcp
      EU_LEGAL_MCP_URL: http://eu-legal-mcp:3000/mcp
      EVM_MCP_URL: http://evm-mcp:3000/mcp
      MARKETS_MCP_URL: http://prediction-markets-mcp:3000/mcp
      PROMPTS_MCP_URL: http://system-prompts:3000/mcp
      TRANSCRIPT_MCP_URL: http://transcript-mcp:3000/mcp
      US_LEGAL_MCP_URL: http://us-legal-mcp:3000/mcp
    ports:
      # @notice Loopback only. Host port 8090, container port 8080.
      - "127.0.0.1:8090:8080"
    volumes:
      # @notice The file in the repo is what the container reads, so an
      #         allowlist edit does not require an image rebuild. Restart
      #         the gateway after an edit. The catalog also refreshes every
      #         30 seconds, but the allowlist is read only at process start.
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
