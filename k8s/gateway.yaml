# @title Gateway Deployment and Service
# @notice One stateless replica of the gateway, reachable only inside the cluster.
# @dev This file does not create an Ingress or a LoadBalancer. On a laptop,
#      `kubectl port-forward svc/omni-gateway 8090:8080` is how a client on the
#      host connects. 8090 is the host port because this laptop already
#      publishes something else on 8080. The Service port stays 8080.
#      That forward is the stand-in for the future public URL.
#      medical-mcp is a different manifest, in the medical-mcp repo. Apply that
#      first. This Service does not select medical Pods.
#
#      The ConfigMap is generated by kustomization.yaml at the repo root,
#      from config/gateway.yaml. Kustomize only reads files inside its own
#      directory, which is why that file is not inside k8s/. Edit the
#      allowlist in config/gateway.yaml, then `kubectl apply -k .`.
#
#      replicas is 1. A second replica answers correctly, because there is no
#      session to pin, but its rate-limit bucket is separate. Milestone 3
#      scales to 2 to prove a call still works, then scales back.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-gateway
  labels:
    app: omni-gateway
spec:
  replicas: 1
  selector:
    # @notice Must match the Pod template labels. A typo here creates a
    #         Deployment whose Pods the Service will not select.
    matchLabels:
      app: omni-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # @notice Start the new Pod before stopping the old one, so a one-replica
      #         rollout still has something ready. This needs a little spare
      #         memory on the node for two gateway Pods during the swap.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        # @notice The Service and the NetworkPolicy both select this label.
        #         The policy's allow rule is `app: omni-gateway`, not the Service name.
        app: omni-gateway
    spec:
      # @notice Kubernetes waits this long after SIGTERM before SIGKILL.
      #         The process exits on SIGTERM within about ten seconds.
      terminationGracePeriodSeconds: 15
      containers:
        - name: omni-gateway
          # @notice Local image from `docker compose build`. This Docker Desktop
          #         keeps Kubernetes images in a separate containerd
          #         (UseContainerdSnapshotter is off), so the kubelet cannot
          #         see a tag that only `docker build` knows. scripts/load-k8s-images.sh
          #         copies the tag into that store. A hosted cluster pulls
          #         from a registry instead; that milestone replaces this name.
          image: omni-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # @notice Bind settings. The allowlist is the mounted file, not env.
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: GATEWAY_CONFIG
              value: /config/gateway.yaml
            # MEDICAL_MCP_URL is intentionally unset. The file's cluster DNS
            # name is the one this Deployment should use.
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            # @notice Not ready until medical-mcp's /readyz answers.
            #         A failed probe removes this Pod from the Service.
            #         It does not restart the Pod.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            # @notice Process up. Does not call medical-mcp. An upstream or
            #         backend outage must not restart the gateway.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # @notice The gateway does not cache PubMed results. It holds the
            #         tool list and the rate-limit map. These numbers are a
            #         ceiling for that, not a guess at medical-mcp's memory.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "250m"
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            # @notice Name produced by kustomization.yaml. The key gateway.yaml
            #         is the file name, mounted at /config/gateway.yaml.
            name: omni-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: omni-gateway
  labels:
    app: omni-gateway
spec:
  # @notice ClusterIP is an address only Pods can use. It is not a host port
  #         and it is not a load balancer. Port-forward is a separate tunnel
  #         you start by hand. The hosting milestone adds an Ingress in front
  #         of this Service and still does not change medical-mcp to NodePort.
  type: ClusterIP
  selector:
    app: omni-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
